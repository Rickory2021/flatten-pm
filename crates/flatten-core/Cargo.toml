# crates/flatten-core/Cargo.toml
[package]
name = "flatten-core"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.7"
rmp-serde = "1.3.1"
rquickjs = { version = "0.13.0", features = ["bindgen"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
